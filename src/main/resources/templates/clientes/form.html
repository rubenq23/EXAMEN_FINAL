<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${modo == 'crear'} ? 'VentasFix — Nuevo cliente' : 'VentasFix — Editar cliente'">VentasFix</title>
    <link rel="stylesheet" th:href="@{/css/neon.css}">
</head>
<body>
<div class="app">
    <div th:replace="~{fragments/nav :: sidebar('clientes')}"></div>

    <div class="main">
        <div class="topbar">
            <h1 th:text="${modo == 'crear'} ? 'Nuevo cliente' : 'Editar cliente'">Cliente</h1>
        </div>

        <div class="content" style="max-width:600px;">
            <div class="card">
                <form th:action="${modo == 'crear'} ? @{/clientes} : @{/clientes/{id}(id=${id})}"
                      th:object="${cliente}" method="post">

                    <div class="field">
                        <label for="rutEmpresa">RUT Empresa</label>
                        <input type="text" id="rutEmpresa" th:field="*{rutEmpresa}">
                    </div>

                    <div class="field">
                        <label for="razonSocial">Razón Social</label>
                        <input type="text" id="razonSocial" th:field="*{razonSocial}">
                    </div>

                    <div class="field">
                        <label for="rubro">Rubro</label>
                        <input type="text" id="rubro" th:field="*{rubro}">
                    </div>

                    <div class="field">
                        <label for="telefono">Teléfono</label>
                        <input type="text" id="telefono" th:field="*{telefono}">
                    </div>

                    <div class="field">
                        <label for="direccion">Dirección</label>
                        <input type="text" id="direccion" th:field="*{direccion}">
                    </div>

                    <div class="field">
                        <label for="nombreContacto">Nombre contacto</label>
                        <input type="text" id="nombreContacto" th:field="*{nombreContacto}">
                    </div>

                    <div class="field">
                        <label for="emailContacto">Email contacto</label>
                        <input type="email" id="emailContacto" th:field="*{emailContacto}">
                    </div>

                    <div style="display:flex; gap:12px; margin-top:8px;">
                        <button type="submit" class="btn"
                                th:text="${modo == 'crear'} ? 'Crear cliente' : 'Guardar cambios'">Guardar</button>
                        <a th:href="@{/clientes}" class="btn ghost">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
