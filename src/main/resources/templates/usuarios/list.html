<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>VentasFix — Usuarios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/neon.css}">
</head>
<body>
<div class="app">
    <div th:replace="~{fragments/nav :: sidebar('usuarios')}"></div>

    <div class="main">
        <div class="topbar">
            <h1>Usuarios</h1>
            <div class="user-chip">
                <span th:text="${#authentication.name}">usuario@ventasfix.cl</span>
                <form th:action="@{/logout}" method="post">
                    <button type="submit">Salir</button>
                </form>
            </div>
        </div>

        <div class="content">
            <div style="display:flex; justify-content:flex-end; margin-bottom:16px;">
                <a th:href="@{/usuarios/nuevo}" class="btn">+ Nuevo usuario</a>
            </div>

            <div class="card" style="padding:0;">
                <table>
                    <thead>
                    <tr>
                        <th>RUT</th>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${usuarios}">
                        <td th:text="${u.rut}">11.111.111-1</td>
                        <td th:text="${u.nombre + ' ' + u.apellido}">Nombre Apellido</td>
                        <td th:text="${u.email}">correo@ventasfix.cl</td>
                        <td style="text-align:right;">
                            <div style="display:flex; gap:8px; justify-content:flex-end;">
                                <a th:href="@{/usuarios/{id}/editar(id=${u.id})}" class="btn ghost">Editar</a>
                                <form th:action="@{/usuarios/{id}/eliminar(id=${u.id})}" method="post"
                                      onsubmit="return confirm('¿Eliminar este usuario?');" style="margin:0;">
                                    <button type="submit" class="btn danger">Eliminar</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(usuarios)}">
                        <td colspan="4" style="text-align:center; color:var(--text-muted); padding:32px;">
                            No hay usuarios registrados todavía.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
