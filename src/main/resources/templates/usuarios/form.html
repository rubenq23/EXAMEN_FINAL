<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${modo == 'crear'} ? 'VentasFix — Nuevo usuario' : 'VentasFix — Editar usuario'">VentasFix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/neon.css}">
</head>
<body>
<div class="app">
    <div th:replace="~{fragments/nav :: sidebar('usuarios')}"></div>

    <div class="main">
        <div class="topbar">
            <h1 th:text="${modo == 'crear'} ? 'Nuevo usuario' : 'Editar usuario'">Usuario</h1>
            <div class="user-chip">
                <span th:text="${#authentication.name}">usuario@ventasfix.cl</span>
                <form th:action="@{/logout}" method="post">
                    <button type="submit">Salir</button>
                </form>
            </div>
        </div>

        <div class="content" style="max-width:480px;">
            <div class="card">
                <p class="error-text" th:if="${errorGeneral}" th:text="${errorGeneral}"></p>

                <form th:action="${modo == 'crear'} ? @{/usuarios} : @{/usuarios/{id}(id=${id})}"
                      th:object="${usuario}" method="post">

                    <div class="field">
                        <label for="rut">RUT</label>
                        <input type="text" id="rut" th:field="*{rut}" placeholder="11.111.111-1">
                        <span class="error-text" th:if="${#fields.hasErrors('rut')}" th:errors="*{rut}"></span>
                    </div>

                    <div class="field">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" th:field="*{nombre}">
                        <span class="error-text" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
                    </div>

                    <div class="field">
                        <label for="apellido">Apellido</label>
                        <input type="text" id="apellido" th:field="*{apellido}">
                        <span class="error-text" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></span>
                    </div>

                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" th:field="*{email}" placeholder="nombre@ventasfix.cl">
                        <span class="error-text" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                    </div>

                    <div class="field">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" th:field="*{password}">
                        <span class="error-text" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                    </div>

                    <div style="display:flex; gap:12px; margin-top:8px;">
                        <button type="submit" class="btn"
                                th:text="${modo == 'crear'} ? 'Crear usuario' : 'Guardar cambios'">Guardar</button>
                        <a th:href="@{/usuarios}" class="btn ghost">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
